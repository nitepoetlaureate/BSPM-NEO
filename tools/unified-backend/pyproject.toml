[project]
name = "ccgs-unified-backend"
version = "0.1.0"
description = "FastAPI backend for BARRY SHARP'S PRO MOVER"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "qdrant-client>=1.7.0",
    "gradio-client>=0.11.0",
    "loguru>=0.7.0",
    "filelock>=3.13.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "pillow>=12.1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "pyright>=1.1.350",
    "pre-commit>=3.6.0",
    "responses>=0.25.0",
    "respx>=0.22.0",
]
